<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>姸姸和小賀會幸福一輩子</title>
  <style>
    :root {
      --color-bg: #fff8fb;
      --color-surface: #fffdfd;
      --color-surface-2: #fff1f6;
      --color-border: #f1d5df;
      --color-text: #3a2730;
      --color-muted: #8e6f7a;
      --color-primary: #ee8fb1;
      --color-primary-2: #ffd9e7;
      --shadow: 0 18px 50px rgba(103, 63, 80, 0.15);
      --max-width: 1120px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--color-text);
      background: radial-gradient(circle at top left, rgba(255,182,212,.28), transparent 32%), radial-gradient(circle at right top, rgba(255,230,170,.18), transparent 26%), var(--color-bg);
      line-height: 1.6;
    }
    img { max-width: 100%; display: block; }
    .container { width: min(calc(100% - 2rem), var(--max-width)); margin: 0 auto; }
    .header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px); background: rgba(255,248,251,.88); border-bottom: 1px solid rgba(238,143,177,.16); }
    .nav { display:flex; align-items:center; justify-content:space-between; padding:1rem 0; }
    .brand { font-weight: 800; letter-spacing: .04em; }
    .hero { padding: 3rem 0 2rem; }
    .hero-grid { display:grid; grid-template-columns: 1.1fr .9fr; gap: 1.5rem; align-items: center; }
    .hero-copy, .panel, .upload-panel { background: var(--color-surface); border: 1px solid rgba(238,143,177,.18); border-radius: 28px; box-shadow: var(--shadow); }
    .hero-copy { padding: 2rem; }
    h1 { font-size: clamp(2rem, 6vw, 4rem); line-height: 1.05; margin: 0 0 1rem; }
    .lead { color: var(--color-muted); margin: 0; }
    .hero-main { overflow:hidden; border-radius: 30px; box-shadow: var(--shadow); background: var(--color-surface); }
    .hero-main button, .gallery-item .zoomable { all: unset; display:block; width:100%; cursor: zoom-in; }
    .hero-main img, .gallery-item img { width:100%; height:100%; object-fit: cover; }
    .section { padding: 1rem 0 2rem; }
    .section-title { margin: 0 0 .75rem; font-size: 1.5rem; }
    .panel { padding: 1.4rem; }
    .upload-panel { padding: 1.2rem; display:grid; gap:1rem; margin-bottom:1.25rem; }
    .upload-row { display:flex; flex-wrap:wrap; gap:.9rem; align-items:center; }
    .upload-input { flex:1 1 280px; padding:.95rem 1rem; background:var(--color-surface-2); border:1px dashed var(--color-border); border-radius:18px; min-height: 54px; display:flex; align-items:center; }
    .upload-btn, .ghost-btn { border:none; border-radius:999px; padding:.9rem 1.2rem; font:inherit; cursor:pointer; }
    .upload-btn { background: var(--color-primary); color: #fff; }
    .ghost-btn { background: transparent; color: var(--color-muted); border:1px solid var(--color-border); }
    .upload-help { color: var(--color-muted); font-size: .95rem; }
    .gallery-wrap { background: linear-gradient(180deg, transparent, rgba(255,207,225,.28)); border-radius: 36px; padding: 1rem; }
    .gallery { columns: 1; column-gap: 1rem; }
    @media (min-width: 700px) { .gallery { columns: 2; } }
    @media (min-width: 1000px) { .gallery { columns: 3; } }
    .gallery-item { break-inside: avoid; margin: 0 0 1rem; background: var(--color-surface); border-radius: 24px; overflow:hidden; box-shadow: var(--shadow); border:1px solid rgba(238,143,177,.14); position:relative; }
    .gallery-item.is-hidden-by-user { display:none !important; }
    .gallery-badge { position:absolute; top:.85rem; left:.85rem; background: rgba(255,255,255,.88); color: var(--color-primary); border:1px solid rgba(238,143,177,.28); border-radius:999px; padding:.28rem .6rem; font-size:.72rem; font-weight:700; letter-spacing:.04em; z-index:3; }
    .delete-photo-btn { position:absolute; top:.85rem; right:.85rem; width:38px; height:38px; border:none; border-radius:999px; background: rgba(30,20,26,.72); color:#fff; font-size:1rem; cursor:pointer; display:grid; place-items:center; box-shadow:0 8px 24px rgba(0,0,0,.18); z-index:4; }
    .lightbox { position: fixed; inset: 0; background: rgba(18,12,9,.82); display:flex; align-items:center; justify-content:center; padding:1.25rem; z-index:9999; opacity:0; pointer-events:none; transition: opacity .18s ease; }
    .lightbox.is-open { opacity:1; pointer-events:auto; }
    .lightbox-dialog { position: relative; width:min(100%, 1100px); max-height:100%; display:grid; gap:.8rem; justify-items:center; }
    .lightbox-figure { margin:0; width:100%; display:grid; gap:.75rem; justify-items:center; }
    .lightbox-figure img { width:auto; max-width:100%; max-height:min(82vh, 1000px); object-fit:contain; border-radius:24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); background:#000; }
    .lightbox-caption, .lightbox-hint { color:#f8efe4; text-align:center; }
    .lightbox-close { position:absolute; top:-.25rem; right:-.25rem; width:44px; height:44px; border-radius:999px; border:1px solid rgba(255,255,255,.24); background: rgba(255,255,255,.08); color:#fff; font-size:1.35rem; cursor:pointer; }
    .footer { padding: 2rem 0 3rem; text-align:center; color:var(--color-muted); }
    @media (max-width: 840px) { .hero-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <div class="brand">姸姸和小賀會幸福一輩子</div>
      <div>幸福相簿</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <h1>姸姸和小賀<br><span style="color:var(--color-primary)">會幸福一輩子</span></h1>
          <p class="lead">這裡記錄著姸姸和小賀的幸福日常，也把每一張可愛照片收藏在同一個可以一直回來看的小天地。</p>
        </div>
        <figure class="hero-main">
          <button type="button" class="zoomable" data-caption="姸姸和小賀會幸福一輩子">
            <img src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?auto=format&fit=crop&w=1200&q=80" alt="姸姸和小賀會幸福一輩子">
          </button>
        </figure>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="panel" style="margin-bottom:1rem;">
          <h2 class="section-title">幸福留言</h2>
          <p class="lead">不管是日常、合照、搞怪瞬間，還是每一次陪在彼此身邊的時候，都在慢慢累積成屬於姸姸和小賀的一輩子幸福。</p>
        </div>

        <div class="upload-panel">
          <div>
            <strong style="display:block; margin-bottom:.35rem;">真正雲端上傳設定</strong>
            <div class="upload-help">網站會直接從 Netlify 環境變數讀取 Supabase 設定，成功後你上傳的照片會儲存到雲端並顯示在網站上。</div>
          </div>
          <div class="upload-row">
            <div class="upload-input" id="cloudConfigStatus">正在檢查雲端設定…</div>
          </div>
          <div class="upload-row">
            <input class="upload-input" id="photoUpload" type="file" accept="image/*" multiple>
            <button class="upload-btn" id="addPhotoBtn" type="button">上傳到雲端</button>
            <button class="ghost-btn" id="refreshCloudBtn" type="button">重新整理雲端清單</button>
          </div>
        </div>

        <div class="gallery-wrap">
          <div class="gallery" id="galleryGrid">
            <figure class="gallery-item" data-default-id="default-1">
              <button type="button" class="delete-photo-btn" data-delete-default="default-1" aria-label="刪除這張照片">✕</button>
              <button type="button" class="zoomable" data-caption="姸姸和小賀會幸福一輩子">
                <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" alt="姸姸和小賀會幸福一輩子" loading="lazy">
              </button>
            </figure>
            <figure class="gallery-item" data-default-id="default-2">
              <button type="button" class="delete-photo-btn" data-delete-default="default-2" aria-label="刪除這張照片">✕</button>
              <button type="button" class="zoomable" data-caption="姸姸和小賀的幸福照片">
                <img src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=900&q=80" alt="姸姸和小賀的幸福照片" loading="lazy">
              </button>
            </figure>
            <figure class="gallery-item" data-default-id="default-3">
              <button type="button" class="delete-photo-btn" data-delete-default="default-3" aria-label="刪除這張照片">✕</button>
              <button type="button" class="zoomable" data-caption="姸姸和小賀的幸福日常">
                <img src="https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=900&q=80" alt="姸姸和小賀的幸福日常" loading="lazy">
              </button>
            </figure>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    姸姸和小賀會幸福一輩子。
  </footer>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="照片放大檢視">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="關閉放大照片">×</button>
      <figure class="lightbox-figure">
        <img id="lightboxImage" src="" alt="放大照片">
        <figcaption class="lightbox-caption" id="lightboxCaption"></figcaption>
      </figure>
      <div class="lightbox-hint">點背景或按 Esc 可關閉</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    async function loadNetlifySupabaseConfig() {
      const res = await fetch('/.netlify/functions/supabase-config', { cache: 'no-store' });
      if (!res.ok) throw new Error('Failed to load Netlify config');
      return await res.json();
    }
  </script>
  <script>
    (function() {
      const galleryGrid = document.getElementById('galleryGrid');
      const uploadInput = document.getElementById('photoUpload');
      const addPhotoBtn = document.getElementById('addPhotoBtn');
      const refreshCloudBtn = document.getElementById('refreshCloudBtn');
      const cloudConfigStatus = document.getElementById('cloudConfigStatus');
      const lightbox = document.getElementById('lightbox');
      const lightboxImage = document.getElementById('lightboxImage');
      const lightboxCaption = document.getElementById('lightboxCaption');
      const lightboxClose = document.getElementById('lightboxClose');
      const hiddenDefaultsKey = 'yan-he-hidden-default-photos';
      let supabaseClient = null;
      let supabaseBucket = 'photos';

      function closeLightbox() {
        lightbox.classList.remove('is-open');
        lightbox.setAttribute('aria-hidden', 'true');
        lightboxImage.removeAttribute('src');
        lightboxCaption.textContent = '';
        document.body.style.overflow = '';
      }

      function openLightbox(button) {
        const img = button.querySelector('img');
        if (!img) return;
        lightboxImage.src = img.currentSrc || img.src;
        lightboxImage.alt = img.alt || '放大照片';
        lightboxCaption.textContent = button.dataset.caption || img.alt || '';
        lightbox.classList.add('is-open');
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }

      function getHiddenDefaults() {
        return JSON.parse(localStorage.getItem(hiddenDefaultsKey) || '[]');
      }

      function saveHiddenDefaults(items) {
        localStorage.setItem(hiddenDefaultsKey, JSON.stringify(items));
      }

      function applyHiddenDefaults() {
        const hidden = getHiddenDefaults();
        hidden.forEach((id) => {
          const card = galleryGrid.querySelector(`[data-default-id="${id}"]`);
          if (card) card.classList.add('is-hidden-by-user');
        });
      }

      function hideDefaultPhoto(id) {
        const hidden = getHiddenDefaults();
        if (!hidden.includes(id)) {
          hidden.push(id);
          saveHiddenDefaults(hidden);
        }
        const card = galleryGrid.querySelector(`[data-default-id="${id}"]`);
        if (card) card.classList.add('is-hidden-by-user');
      }

      function createCloudFigure(src, altText, path) {
        const figure = document.createElement('figure');
        figure.className = 'gallery-item is-user-uploaded';
        figure.dataset.storagePath = path;
        figure.innerHTML = `
          <span class="gallery-badge">雲端照片</span>
          <button type="button" class="delete-photo-btn" data-delete-cloud="${path}" aria-label="刪除這張照片">✕</button>
          <button type="button" class="zoomable" data-caption="${altText}">
            <img src="${src}" alt="${altText}" loading="lazy">
          </button>
        `;
        return figure;
      }

      async function loadCloudPhotos() {
        if (!supabaseClient) return;
        document.querySelectorAll('.gallery-item.is-user-uploaded').forEach((el) => el.remove());
        const { data, error } = await supabaseClient.storage.from(supabaseBucket).list('yan-he', {
          limit: 100,
          sortBy: { column: 'created_at', order: 'desc' }
        });
        if (error) {
          console.error(error);
          cloudConfigStatus.textContent = '已連線 Supabase，但讀取雲端照片失敗';
          return;
        }
        (data || []).forEach((file) => {
          const path = `yan-he/${file.name}`;
          const { data: publicData } = supabaseClient.storage.from(supabaseBucket).getPublicUrl(path);
          galleryGrid.prepend(createCloudFigure(publicData.publicUrl, '姸姸和小賀的雲端幸福照片', path));
        });
      }

      async function initCloudConfig() {
        try {
          const runtimeConfig = await loadNetlifySupabaseConfig();
          if (!runtimeConfig.url || !runtimeConfig.key || !runtimeConfig.bucket) {
            throw new Error('Missing Netlify env config');
          }
          supabaseBucket = runtimeConfig.bucket;
          supabaseClient = window.supabase.createClient(runtimeConfig.url, runtimeConfig.key);
          cloudConfigStatus.textContent = '已從 Netlify 讀取 Supabase 設定，現在可以雲端上傳';
          await loadCloudPhotos();
        } catch (err) {
          console.error(err);
          cloudConfigStatus.textContent = '尚未從 Netlify 讀到 Supabase 設定，請先確認 Netlify 環境變數';
        }
      }

      async function uploadFiles(files) {
        if (!supabaseClient) {
          alert('尚未從 Netlify 讀到 Supabase 設定，請先確認 Netlify 環境變數');
          return;
        }
        for (const [index, file] of Array.from(files).entries()) {
          if (!file.type.startsWith('image/')) continue;
          const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
          const path = `yan-he/${Date.now()}-${index}-${Math.random().toString(36).slice(2,8)}.${ext}`;
          const { error } = await supabaseClient.storage.from(supabaseBucket).upload(path, file, {
            upsert: false,
            contentType: file.type || 'image/jpeg'
          });
          if (error) {
            console.error(error);
            alert('雲端上傳失敗，請確認 Supabase bucket 與 policy 設定');
            return;
          }
        }
        await loadCloudPhotos();
      }

      async function deleteCloudPhoto(path) {
        if (!supabaseClient) return;
        const { error } = await supabaseClient.storage.from(supabaseBucket).remove([path]);
        if (error) {
          console.error(error);
          alert('刪除雲端照片失敗，請確認 Supabase delete policy');
          return;
        }
        await loadCloudPhotos();
      }

      document.addEventListener('click', function(e) {
        const zoomBtn = e.target.closest('.zoomable');
        if (zoomBtn) {
          e.preventDefault();
          openLightbox(zoomBtn);
          return;
        }
        const deleteDefaultBtn = e.target.closest('[data-delete-default]');
        if (deleteDefaultBtn) {
          e.preventDefault();
          e.stopPropagation();
          hideDefaultPhoto(deleteDefaultBtn.dataset.deleteDefault);
          return;
        }
        const deleteCloudBtn = e.target.closest('[data-delete-cloud]');
        if (deleteCloudBtn) {
          e.preventDefault();
          e.stopPropagation();
          deleteCloudPhoto(deleteCloudBtn.dataset.deleteCloud);
          return;
        }
        if (e.target === lightbox || e.target === lightboxClose) {
          e.preventDefault();
          closeLightbox();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && lightbox.classList.contains('is-open')) closeLightbox();
      });

      addPhotoBtn.addEventListener('click', function() {
        if (!uploadInput.files || !uploadInput.files.length) return;
        uploadFiles(uploadInput.files).then(() => {
          uploadInput.value = '';
        });
      });

      refreshCloudBtn.addEventListener('click', function() {
        loadCloudPhotos();
      });

      applyHiddenDefaults();
      initCloudConfig();
    })();
  </script>
</body>
</html>
